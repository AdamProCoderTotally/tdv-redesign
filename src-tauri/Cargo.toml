[package]
name = "tdv"
version = "0.2.17"
description = "Tower Defence V"
authors = ["Adam Dalison-Sanskas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tdv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# already in the tree via tauri-plugin-updater; named here so we can build the
# Version values our custom update comparator compares (see src/lib.rs)
semver = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
